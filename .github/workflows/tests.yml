name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and UI
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ui]' -c constraints-mac.txt
      - name: Runtime regression checks
        run: python -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          python -m compileall -q mps_runtime.py gradio_app.py inference_runtime.py
          bash -n scripts/setup-mac.sh scripts/gradio-mac.sh scripts/fetch-modelscope.sh
